apis:
- name: Evolv Participant API
  description: >-
    The Evolv Participant API is the runtime edge API the client SDKs call to fetch a
    participant's experiment configuration and allocations for an environment, and to
    ingest context and behavioral events (the "beacon"/data endpoint). Requests are keyed
    by a public environment id and a participant uid; the API is versioned in the URL path
    (v1). Documented as a public Postman collection at developers.evolv.ai.
  humanURL: https://developers.evolv.ai/
  baseURL: https://participants.evolv.ai
  tags:
  - Experimentation
  - Optimization
  - Personalization
