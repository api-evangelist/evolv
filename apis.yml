aid: evolv
name: Evolv
description: >-
  Evolv AI (formerly Sentient Ascend) is an experience optimization and autonomous
  experimentation platform that continuously tests and personalizes digital experiences
  using machine learning. Its Participant API and official client SDKs for JavaScript,
  iOS, Android, PHP and React allocate visitors to experiment variants, deliver optimized
  configurations, and ingest behavioral events so AI-driven optimization can evolve web
  and app experiences without manual A/B-test management. Enterprises use Evolv AI to
  automate conversion-rate optimization and personalization across their digital properties.
