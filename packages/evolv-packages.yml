currency_summary: >-
  Nine of the thirteen first-party distributions were last published in 2023 or earlier.
  The flagship @evolv/client stable tag is from 2024-08-26 and all subsequent work sits on
  an alpha tag. The Android SDK has no versioned artifact at all. Evolv's GitHub
  organisation is still active (commits through 2026-06), so this is a release-discipline
  gap rather than an abandoned platform: the work is happening, but it is not reaching the
  registries consumers install from.
