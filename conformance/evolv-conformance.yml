standards:
- id: openapi
  conforms: false
  evidence: >-
    Evolv publishes no OpenAPI. The machine-readable contract it does publish is a Postman
    Collection v2 (schema.getpostman.com/json/collection/v2.0.0), served at
    developers.evolv.ai and saved verbatim in postman/.
- id: postman-collection-v2
  conforms: true
  evidence: >-
    postman/evolv-participant-api.postman_collection.json — Evolv's own published
    collection, 7 operations across 4 folders with saved response examples.
- id: oauth2
  conforms: false
  evidence: >-
    No OAuth flows. Access is by public environment id in the URL path; the collection
    declares an undocumented bearer token. /.well-known/oauth-authorization-server 404s or
    403s on every host.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns no document on any Evolv host.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Error bodies are application/json {"msg":"..."} with no type/title/status/detail
    members, and the configuration route returns S3 XML on 403. See
    errors/evolv-problem-types.yml.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    /.well-known/security.txt returns 301->401 (apex), 404 (docs), 403 (API) and an SPA HTML
    shell (console). See well-known/evolv-well-known.yml.
- id: rfc8594-sunset
  conforms: false
  evidence: No Sunset or Deprecation headers observed; no deprecation policy published.
- id: rfc6585-rate-limit
  conforms: false
  evidence: >-
    No RateLimit-*, X-RateLimit-* or Retry-After headers on any observed response, and no
    published limits. See rate-limits/evolv-rate-limits.yml.
- id: idempotency-key
  conforms: false
  evidence: >-
    No idempotency key or de-duplication contract on any write operation, including the
    batch event route. See conventions/evolv-conventions.yml.
- id: https-tls
  conforms: true
  evidence: >-
    All hosts (evolv.ai, www, developers, participants) serve TLSv1.3. See
    security/evolv-domain-security.yml.
- id: hsts
  conforms: partial
  evidence: >-
    developers.evolv.ai sets Strict-Transport-Security with max-age 31536000; www.evolv.ai
    and participants.evolv.ai do not. The API host — the one that matters most — is the one
    without it.
- id: dnssec
  conforms: false
  evidence: evolv.ai is not DNSSEC-signed. See security/evolv-domain-security.yml.
- id: spf-dmarc
  conforms: true
  evidence: evolv.ai publishes SPF and DMARC (policy quarantine).
- id: caa
  conforms: true
  evidence: 'evolv.ai publishes CAA records: amazon.com, letsencrypt.org.'
- id: cors
  conforms: true
  evidence: >-
    Every observed response, including errors, carries access-control-allow-origin:* and
    access-control-allow-credentials:true — the API is designed for browser callers.
- id: json
  conforms: true
  evidence: >-
    Reads return application/json (configuration, allocations, preallocations); writes accept
    x-www-form-urlencoded and, on the batch route, application/json.
